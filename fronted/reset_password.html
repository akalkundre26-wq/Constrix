<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Set New Password - Constrix</title>

    <link rel="stylesheet" href="/CSS/login.css">
    <link rel="stylesheet" href="/CSS/mobile.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h2>Set New Password</h2>

        <p>Create a new password for your Constrix account.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="input-group">
                <label>New Password</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >
            </div>

            <div class="input-group">
                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit">
                Change Password
            </button>

        </form>

    </div>

</div>

</body>
</html>
