<!DOCTYPE html>
<html>

<head>
    <title>Customer Registration - Constrix</title>
    <link rel="stylesheet" href="/CSS/login.css">

      <!-- MOBILE CSS - ALWAYS LAST -->
    <link rel="stylesheet" href="/CSS/mobile.css">
</head>

<body>

<div class="login-container">

    <h2>Customer Registration</h2>

    <form method="POST">

        <input
            type="text"
            name="full_name"
            placeholder="Full Name"
            required>

      <input
    type="email"
    name="email"
    placeholder="Email"
    autocomplete="off"
    required>

      <input
    type="text"
    name="username"
    placeholder="Username"
    autocomplete="off"
    required>

        <input
            type="text"
            name="mobile"
            placeholder="Mobile Number"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <input
            type="text"
            name="contractor_code"
            placeholder="Contractor Code"
            required>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('customer_login') }}">
            Login
        </a>
    </p>

</div>

</body>

</html>
