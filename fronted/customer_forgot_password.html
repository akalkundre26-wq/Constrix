<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Constrix</title>
    <link rel="stylesheet" href="/CSS/login.css">

    <!-- MOBILE CSS - ALWAYS LAST -->
    <link rel="stylesheet" href="/CSS/mobile.css">
</head>

<body>

<div class="form-container">

    <h1>CONSTRIX</h1>
    <h2>Forgot Password</h2>
    <p>Enter your details to request a password reset</p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="date"
            name="dob"
            required>

            <div class="input-group">
    <label>Mobile Number</label>
    <input
        type="tel"
        name="mobile"
        placeholder="Enter registered mobile number"
        maxlength="10"
        pattern="[0-9]{10}"
        inputmode="numeric"
        required
    >
</div>

        <input
            type="text"
            name="contractor_code"
            placeholder="Contractor Code"
            required>

        <button type="submit">
             Password Reset
        </button>

    </form>

  <p class="forgot-password">
    <a href="{{ url_for('admin_login') }}">
        ← Back to Admin Login
    </a>
</p>

</div>

</body>
</html>
