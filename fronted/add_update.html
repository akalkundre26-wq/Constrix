<!DOCTYPE html>
<html>

<head>
    <title>Add Daily Update - Constrix</title>
    <link rel="stylesheet" href="C:\Users\Aditya Kalkundre\OneDrive\Desktop\Constrix\CSS\project_detailed.css">
</head>

<body>

    <header>
        <h2>CONSTRIX</h2>
        <p>Add Daily Project Update</p>
    </header>

    <main>

        <h1>Add Daily Update</h1>

        <form>

            <label>Date:</label>
            <input type="date">

            <br><br>

            <label>Work Done Today:</label>
            <textarea rows="4"></textarea>

            <br><br>

            <label>Next Work:</label>
            <textarea rows="4"></textarea>

            <br><br>

            <label>Project Progress:</label>
            <input type="number" min="0" max="100"> %

            <br><br>

            <label>Upload Photos:</label>
            <input type="file" multiple>

            <br><br>

            <label>Notes:</label>
            <textarea rows="4"></textarea>

            <br><br>

            <button type="submit">Save Update</button>

        </form>

    </main>

</body>

</html>
