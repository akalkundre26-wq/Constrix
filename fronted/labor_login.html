<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labor Login - Constrix</title>

    <link rel="stylesheet" href="/CSS/login.css">

      <!-- MOBILE CSS - ALWAYS LAST -->
    <link rel="stylesheet" href="/CSS/mobile.css">
</head>

<body>

    <div class="form-container">

        <h1>CONSTRIX</h1>

        <h2>Labor Login</h2>

        <p>Login to view your work and project updates</p>


        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <label>Contractor Code</label>

            <input
                type="text"
                name="contractor_code"
                placeholder="Enter contractor code"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="/labor/register">
                Register
            </a>

        </p>


        <a href="/login" class="back-link">
            ← Back
        </a>

    </div>

</body>

</html>
