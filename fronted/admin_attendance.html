<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Attendance - Constrix</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='attendance.css') }}">
</head>

<body>

<header>
    <h2>CONSTRIX</h2>
</header>

<div class="dashboard">

    <aside>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/projects">Projects</a>
        <a href="/admin/customers">Customers</a>
        <a href="/admin/labor" class="active">Labor</a>
        <a href="/logout">Logout</a>
    </aside>

   <main>

    <h1>Today's Attendance</h1>

    <!-- FORM START -->
    <form method="POST">

        <div class="attendance-top">

            <!-- DATE -->
            <div>
                <label>Date</label>

                <input type="date"
                       name="attendance_date"
                       required>
            </div>


            <!-- PROJECT -->
            <div>
                <label>Project</label>

                <select name="project_id" required>

                    <option value="">
                        Select Project
                    </option>

                    {% for project in projects %}

                    <option value="{{ project['id'] }}">
                        {{ project["project_name"] }}
                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <!-- LABOR TABLE -->

        <table>

            <thead>
                <tr>
                    <th>Labor Name</th>
                    <th>Status</th>
                    <th>OT Hours</th>
                </tr>
            </thead>


            <tbody>

                {% for labor in labors %}

                <tr>

                    <td>
                        {{ labor["full_name"] }}
                    </td>


                    <!-- STATUS -->

                    <td>

                        <select name="status_{{ labor['id'] }}">

                            <option value="Present">
                                Present
                            </option>

                            <option value="Absent">
                                Absent
                            </option>

                            <option value="Half Day">
                                Half Day
                            </option>

                            <option value="Weekly Off">
                                Weekly Off
                            </option>

                        </select>

                    </td>


                    <!-- OVERTIME -->

                    <td>

                        <input type="number"
                               name="ot_{{ labor['id'] }}"
                               value="0"
                               min="0">

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>


        <!-- SAVE BUTTON -->

        <button type="submit"
                class="save-btn">

            Save All Attendance

        </button>

    </form>
    <!-- FORM END -->

</main>

</div>

</body>
</html>
