<!DOCTYPE html>
<html>

<head>
    <title>Customer Login - Constrix</title>
    <link rel="stylesheet" href="../CSS/login.css">

      <!-- MOBILE CSS - ALWAYS LAST -->
    <link rel="stylesheet" href="/CSS/mobile.css">
</head>

<body>

    <div class="form-container">

        <h1>CONSTRIX</h1>
        <h2>Customer Login</h2>
        <p>Login to track your construction project</p>

       <form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <input
        type="text"
        name="contractor_code"
        placeholder="Contractor Code"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

        <p class="register-text">
            Don't have an account?
            <a href="customer_register.html">Register</a>
        </p>
  <a href="/login" class="back-link">
            ← Back
        </a>

    </div>

</body>

</html>
