<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Constrix</title>
    <link rel="stylesheet" href="../CSS/login.css">

    <!-- MOBILE CSS - ALWAYS LAST -->
    <link rel="stylesheet" href="/CSS/mobile.css">
</head>

<body>

    <div class="form-container">

        <h1>CONSTRIX</h1>
        <h2>Customer Login</h2>
        <p>Login to track your construction project</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="login-error">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
          
            <label>Username</label>
           <input
    type="text"
    name="username"
    placeholder="Enter username"
    autocapitalize="none"
    autocomplete="off"
    spellcheck="false"
    required
>

<label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >
<label>Contractor Code</label>
         <input
    type="text"
    name="contractor_code"
    placeholder="Enter contractor code"
    autocapitalize="none"
    autocomplete="off"
    spellcheck="false"
    required
>

            <button type="submit">
                Login
            </button>

            <p class="forgot-password">
                <a href="{{ url_for('customer_forgot_password') }}">
                    Forgot Password?
                </a>
            </p>

        </form>

     <p class="register-text">
    Don't have an account?
    <a href="{{ url_for('customer_register') }}">Register</a>
</p>

        <a href="/login" class="back-link">
            ← Back
        </a>

    </div>

</body>

</html>
