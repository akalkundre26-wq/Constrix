<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Labor Registration - Constrix</title>
    <link rel="stylesheet" href="/CSS/style.css">

    <!-- MOBILE CSS - ALWAYS LAST -->
    <link rel="stylesheet" href="/CSS/mobile.css">
</head>

<body>

<div class="login-box">

    <h2>Labor Registration</h2>

    <form method="POST">

        <label>Full Name</label>
        <input type="text"
               name="full_name"
               required>

        <label>Mobile Number</label>
<input type="tel" name="mobile"
       pattern="[0-9]{10}" maxlength="10"
       required>

        <label>Date of Birth</label>
        <input type="date"
               name="dob"
               required>

        <label>Username</label>
        <input type="text"
               name="username"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               required>

        <label>Contractor Code</label>
        <input type="text"
               name="contractor_code"
               required>

        <button type="submit">
            Register
        </button>

    </form>
<p class="register-text">
    Already have an account?
  <a href="{{ url_for('labor_login') }}">Login</a>
</p>

</div>

</body>
</html>
