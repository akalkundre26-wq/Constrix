<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Labor Registration - Constrix</title>
<link rel="stylesheet" href="/CSS/style.css">

  <!-- MOBILE CSS - ALWAYS LAST -->
    <link rel="stylesheet" href="/CSS/mobile.css">
</head>

<body>

<div class="login-box">

    <h2>Labor Registration</h2>

    <form method="POST">

        <label>Full Name</label>
        <input type="text"
               name="full_name"
               required>

        <label>Mobile Number</label>
        <input type="text"
               name="mobile"
               required>

        <label>Username</label>
        <input type="text"
               name="username"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               required>

        <label>Contractor Code</label>
        <input type="text"
               name="contractor_code"
               required>

        <button type="submit">
            Register
        </button>

    </form>
<p>
    Already have an account?
    <a href="/labor/login">Login</a>
</p>

</div>

</body>
</html>
